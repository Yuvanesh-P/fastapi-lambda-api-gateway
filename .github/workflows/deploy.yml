
name: FastAPI Lambda CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          python -m pytest -v

      - name: Build Lambda deployment package
        run: |
          mkdir package
          pip install \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            --target package \
            -r requirements.txt
          cp -r app package/
          cd package
          zip -r ../lambda-deployment.zip .

      - name: Check GitHub OIDC identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name fastapi-lambda-api \
            --zip-file fileb://lambda-deployment.zip

      - name: Wait for Lambda deployment
        run: |
          aws lambda wait function-updated \
            --function-name fastapi-lambda-api

      - name: Verify Lambda deployment
        run: |
          aws lambda get-function-configuration \
            --function-name fastapi-lambda-api \
            --query '[FunctionName,State,LastUpdateStatus]' \
            --output table
